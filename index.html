<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlockLab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#eef0f6;--pn:#fff;--tx:#191b24;--mu:#5d6172;--ac:#f5a000;--ln:#d5d8e3;--sky:#cfe6ff;--gr:#8fb37a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151c;--pn:#1e2029;--tx:#eceef4;--mu:#9a9fb2;--ln:#343747;--sky:#1d2233;--gr:#3b5233}}
:root[data-theme="dark"]{--bg:#14151c;--pn:#1e2029;--tx:#eceef4;--mu:#9a9fb2;--ln:#343747;--sky:#1d2233;--gr:#3b5233}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:500 15px/1.4 "Space Grotesk",system-ui,sans-serif}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:color-mix(in srgb,var(--bg) 82%,transparent);overflow:auto;z-index:5}
.scr[hidden],.bar[hidden]{display:none}
h1{font-size:clamp(44px,12vw,88px);margin:0;letter-spacing:-.04em;line-height:.9}
h1 b{color:var(--ac)}
h2{margin:0 0 4px}
p{margin:0;color:var(--mu)}
button,input{font:inherit;color:var(--tx);background:var(--pn);border:2px solid var(--ln);border-radius:8px;padding:9px 14px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.on{border-color:var(--ac);background:var(--ac);color:#191b24}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:#191b24;border-color:var(--ac);font-weight:700;padding:12px 22px}
.bar{position:absolute;z-index:4;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;padding:10px;align-items:center;background:var(--pn);border-bottom:2px solid var(--ln)}
.bar.bot{top:auto;bottom:calc(0px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--ln);border-bottom:0}
.bar.top{top:env(safe-area-inset-top,0px)}
.sw{width:30px;height:30px;padding:0;border-radius:6px}
.list{width:min(560px,100%);display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--pn);border:2px solid var(--ln);border-radius:10px;padding:10px 14px}
.row span{flex:1}.row small{color:var(--mu)}
#wp{position:absolute;z-index:6;left:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--pn);border:2px solid var(--ln);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}#wp[hidden]{display:none}
#cp2{position:absolute;z-index:6;left:10px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 20px));background:var(--pn);border:2px solid var(--ln);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}#cp2[hidden]{display:none}#cp2 button{padding:6px 10px}
#cl{position:absolute;z-index:3;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(360px,70%);pointer-events:none;display:flex;flex-direction:column;gap:4px}#cl[hidden]{display:none}
#cl div{background:rgba(0,0,0,.6);color:#fff;padding:4px 10px;border-radius:8px;width:fit-content;max-width:100%}
#toast{position:absolute;z-index:9;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.s{opacity:1}
</style></head><body>
